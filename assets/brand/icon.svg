<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C93"/>
      <stop offset="1" stop-color="#0A3F63"/>
    </linearGradient>
    <path id="blade" d="M0,-4 C10,-12 16,-26 8,-30 C0,-34 -12,-26 -7,-12 Z"/>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- four zones -->
  <rect x="34"  y="34"  width="86" height="86" rx="18" fill="#FFB347"/>
  <rect x="136" y="34"  width="86" height="86" rx="18" fill="#FFFFFF"/>
  <rect x="34"  y="136" width="86" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="136" y="136" width="86" height="86" rx="18" fill="#8BE3F2"/>
  <!-- hub: the bridge, with a fan -->
  <circle cx="128" cy="128" r="44" fill="#0C5D7C"/>
  <circle cx="128" cy="128" r="34" fill="#FFFFFF"/>
  <g transform="translate(128 128) scale(1.12)" fill="#0C5D7C">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(120)"/>
    <use href="#blade" transform="rotate(240)"/>
    <circle r="5"/>
